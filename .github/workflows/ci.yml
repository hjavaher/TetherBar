name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect public files
        run: python3 scripts/check-public.py
      - name: Build universal app and run decision tests
        run: sh build.sh
      - name: Probe security tests and Clang analysis
        run: sh scripts/test.sh
      - name: Validate release packaging
        run: sh scripts/release.sh preview
